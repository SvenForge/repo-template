---
_min_copier_version: "9.17"
_subdirectory: template
_exclude:
  - _modules

features:
  type: str
  help: Which features should be included?
  multiselect: true
  choices: []
  default: []

modules:
  type: yaml
  default: "{{ features + ['core'] }}"
  when: false
---
!include template/_modules/core/copier.yml
