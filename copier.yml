---
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template_new  # TODO: Switch back to template after refactoring is completed

copier_version:
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

features:
  type: str
  help: Which template features shall be used?
  multiselect: true
  choices:
    Codex:
      module: codex
      path: modules/codex
    DevContainer:
      module: devcontainer
      path: modules/devcontainer

files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: []  # TODO: Assemble file list from module outputs

---
!include modules/codex/copier.yml

---
!include modules/devcontainer/copier.yml
