---
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template
_exclude:
  - /_modules

features:
  type: str
  help: Which template features shall be used?
  multiselect: true
  choices:
    Core: core
    Codex: codex
    Copier: copier
    DevContainer: devcontainer
    GitLab: gitlab
    Python: python
    Sphinx: sphinx
  default:
    - core
    - devcontainer
    - gitlab
    - python
    - sphinx
  validator: >-
    {% if 'python' in features and 'core' not in features %}
    Select Core when selecting Python.
    {% endif %}
    {% if 'sphinx' in features and 'python' not in features %}
    Select Python when selecting Sphinx.
    {% endif %}

copier_version:
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false
---
!include template/_modules/core/copier.yml
---
!include template/_modules/codex/copier.yml
---
!include template/_modules/copier/copier.yml
---
!include template/_modules/devcontainer/copier.yml
---
!include template/_modules/gitlab/copier.yml
---
!include template/_modules/python/copier.yml
---
!include template/_modules/sphinx/copier.yml
