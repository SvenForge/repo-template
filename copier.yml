---
# General Configuration
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template

_message_before_copy: |
  Thank you for using our template!

  Choose the parts you need, then answer a few questions about your project.
  Copier will use your answers to create editable project files.
  Use Space to select options in checklists and Enter to confirm your answers.
  For optional text answers, clear the value to skip.

_message_before_update: |
  Thank you for using our template!

  Copier will bring this repository's generated files up to date with the template.
  Your saved answers are the suggested values; review them and any new questions.
  Use Space to select options in checklists and Enter to confirm your answers.
  For optional text answers, clear the value to skip.

_message_after_copy: |
  Project files created in "{{ _copier_conf.dst_path }}".

  Open the project directory and review the generated files.
  "TODO" notes mark places to customize for your project, such as its description or setup instructions.
  If this directory is not a Git repository yet, run "git init" from the project directory.
  After customizing the files, run your project's checks, then review and commit the changes to your repo.
  Keep ".copier-answers.yml"; it saves your choices for later updates with "copier update".

_message_after_update: |
  Template update finished.

  Review the changed files and resolve any conflicts.
  "TODO" notes in added or updated files mark places to customize for your project.
  Run your project's checks, then review and commit the changes, including ".copier-answers.yml".
  Keep ".copier-answers.yml" for future updates.

copier_version:
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

# Module Paths
# When moving a module, update also the corresponding !include below.
module_paths:
  type: yaml
  when: false
  default:
    core: modules/core
    copier: modules/copier
    pyproject: modules/pyproject
    python: modules/python
    sphinx: modules/sphinx
    agents: modules/agents
    gitlab: modules/gitlab
    codex: modules/codex
    claude: modules/claude
    devcontainer: modules/devcontainer

# Feature Selector
features:
  type: str
  help: "[Template] Which features do you want to include?"
  qmark: "📦"
  multiselect: true
  choices:
    Core (README, license, .gitignore): core
    Copier (build another template): copier
    Python (packages, tests, code checks): python
    Sphinx (documentation): sphinx
    GitLab (CI/CD, issue and merge request templates): gitlab
    Codex (agent guidance and integrations): codex
    Claude Code (agent guidance and integrations): claude
    Dev Container (development environment): devcontainer
  default:
    - core
    - devcontainer
    - gitlab
    - python
    - sphinx

# Module Includes and Inputs
# Keep each input definition after the corresponding !include.
# Keep modules in provider-before-consumer order.
---
!include modules/core/copier.yml
---
core_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'core' in features }}

---
!include modules/copier/copier.yml
---
copier_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'copier' in features }}
    version: {{ copier_version | to_json }}

---
!include modules/python/copier.yml
---
python_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'python' in features }}
    repository_name: {{ core.vars.repository_name | to_json }}

---
!include modules/sphinx/copier.yml
---
sphinx_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'sphinx' in features }}
    repository_name: {{ core.vars.repository_name | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    year: {{ core.vars.year }}
    has_readme: {{ 'README.md' in core.files | map(attribute='path') }}
    has_license: {{ 'LICENSE.md' in core.files | map(attribute='path') }}
    {% set packages = namespace(names=[]) %}
    {% for file in python.files %}
    {% if file.path.startswith('src/') and file.path.endswith('/__init__.py') %}
    {% set packages.names = packages.names + [file.path.split('/')[1]] %}
    {% endif %}
    {% endfor %}
    python_packages: {{ packages.names | unique | list | to_json }}

---
!include modules/pyproject/copier.yml
---
pyproject_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    {% set dependencies = (python.contributions + sphinx.contributions) | selectattr('target', 'in', ['pyproject.dev_dependencies', 'pyproject.dependency_groups']) | list %}
    enabled: {{ python.vars.enabled or sphinx.vars.enabled }}
    has_dependency_groups: {{ dependencies | length > 0 }}
    install: {{ ('editable' if python.vars.has_distribution else 'dependencies' if dependencies else 'none') | to_json }}
    {% if python.vars.has_distribution %}
    name: {{ python.vars.distribution_name | to_json }}
    version: ''
    {% else %}
    {% set name = core.vars.repository_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') %}
    name: {{ (name or 'my-project') | to_json }}
    {% endif %}
    readme: {{ ('README.md' if 'README.md' in core.files | map(attribute='path') else '') | to_json }}
    license: {{ (core.vars.license if 'LICENSE.md' in core.files | map(attribute='path') else '') | to_json }}
    license_files: {{ (['LICENSE.md'] if 'LICENSE.md' in core.files | map(attribute='path') else []) | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    owner_email: {{ core.vars.owner_email | to_json }}

---
!include modules/agents/copier.yml
---
agents_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'codex' in features or 'claude' in features }}

---
!include modules/gitlab/copier.yml
---
gitlab_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'gitlab' in features }}
    repository_host: {{ core.vars.repository_host | to_json }}
    repository_path: {{ core.vars.repository_path | to_json }}
    has_readme: {{ 'README.md' in core.files | map(attribute='path') }}
    copier_version: {{ copier.vars.version | to_json }}
    python_enabled: {{ python.vars.enabled }}
    python_tools: {{ python.vars.tools | to_json }}
    python_version: {{ pyproject.vars.python_version | to_json }}
    has_python_distribution: {{ python.vars.has_distribution }}
    sphinx_enabled: {{ sphinx.vars.enabled }}

---
!include modules/codex/copier.yml
---
codex_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'codex' in features }}
    devcontainer_available: {{ 'devcontainer' in features }}

---
!include modules/claude/copier.yml
---
claude_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'claude' in features }}
    devcontainer_available: {{ 'devcontainer' in features }}

---
!include modules/devcontainer/copier.yml
---
devcontainer_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'devcontainer' in features }}
    {% if pyproject.vars.enabled %}
    image: {{ ('mcr.microsoft.com/devcontainers/python:3-' ~ pyproject.vars.python_version ~ '-bookworm') | to_json }}
    {% endif %}

---
# Output Aggregation
# Aggregate each registered module through its exports.jinja, in registry order.
files:
  type: yaml
  when: false
  default: |
    {%- set result = namespace(files=[]) -%}
    {%- for module_path in module_paths.values() -%}
      {%- from module_path ~ '/exports.jinja' import output with context -%}
      {%- for file in output.files -%}
        {%- set result.files = result.files + [{
          'path': file.path,
          'template': module_path ~ '/' ~ file.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.files | to_json }}

contributions:
  type: yaml
  when: false
  default: |
    {%- set result = namespace(contributions=[]) -%}
    {%- for module_path in module_paths.values() -%}
      {%- from module_path ~ '/exports.jinja' import output with context -%}
      {%- for contribution in output.contributions -%}
        {%- set result.contributions = result.contributions + [{
          'target': contribution.target,
          'template': module_path ~ '/' ~ contribution.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.contributions | to_json }}
