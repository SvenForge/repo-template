---
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template_new  # TODO: Switch back to template after refactoring is completed

copier_version:
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

features:
  type: yaml
  help: Which template features shall be used?
  multiselect: true
  choices:
    Codex:
      value:
        module: codex
        path: modules/codex
    DevContainer:
      value:
        module: devcontainer
        path: modules/devcontainer

---
codex_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'codex' in features | map(attribute='module') }}
    devcontainer_enabled: {{ 'devcontainer' in features | map(attribute='module') }}

---
!include modules/codex/copier.yml

---
devcontainer_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'devcontainer' in features | map(attribute='module') }}
    python_enabled: {{ 'python' in features | map(attribute='module') }}
    python_version: {{ python_version | default('3.12') | to_json }}
    python_include_setup: {{ python_include_setup | default(false) | to_json }}
    python_include_distribution: {{ python_include_distribution | default(false) | to_json }}
    python_include_devgroup: {{ python_include_devgroup | default(false) | to_json }}

---
!include modules/devcontainer/copier.yml

---
files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- set module_files = {
      'codex': codex_files,
      'devcontainer': devcontainer_files,
    } -%}
    {%- set result = namespace(files=[]) -%}
    {%- for feature in features -%}
      {%- for file in module_files[feature.module] -%}
        {%- set result.files = result.files + [{
          'path': file.path,
          'template': feature.path ~ '/' ~ file.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.files | to_json }}

contributions:
  type: yaml
  help: Which contributions shall be made to other files?
  when: false
  default: |
    {%- set module_contributions = {
      'codex': codex_contributions,
      'devcontainer': devcontainer_contributions,
    } -%}
    {%- set result = namespace(contributions=[]) -%}
    {%- for feature in features -%}
      {%- for contribution in module_contributions[feature.module] -%}
        {%- set result.contributions = result.contributions + [{
          'id': contribution.id,
          'template': feature.path ~ '/' ~ contribution.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.contributions | to_json }}
