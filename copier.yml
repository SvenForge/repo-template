# General Configuration
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template

copier_version:  # TODO: Maybe remove if *min_copier_version can directly be used as module input
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

# Module Paths
# Update the corresponding !include below when moving a module.
module_paths:
  type: yaml
  when: false
  default:
    core: modules/core
    copier: modules/copier
    python: modules/python
    sphinx: modules/sphinx
    gitlab: modules/gitlab
    codex: modules/codex
    devcontainer: modules/devcontainer

# Select Modules
features:
  type: str
  help: Which template features shall be used?
  multiselect: true
  choices:
    Core: core
    Copier: copier
    Python: python
    Sphinx: sphinx
    GitLab: gitlab
    Codex: codex
    DevContainer: devcontainer
  default:
    - codex
    - devcontainer

---
# Module Includes and Inputs
# Keep each !include beside its host override, in provider-before-consumer order.
!include modules/core/copier.yml
---
core_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'core' in features }}

---
!include modules/copier/copier.yml
---
copier_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'copier' in features }}
    version: {{ copier_version | to_json }}

---
!include modules/python/copier.yml
---
python_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'python' in features }}
    repository_name: {{ core.vars.repository_name | to_json }}
    has_readme: {{ 'README.md' in core.files | map(attribute='path') }}
    has_license: {{ 'LICENSE.md' in core.files | map(attribute='path') }}
    license: {{ core.vars.license | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    owner_email: {{ core.vars.owner_email | to_json }}
    {# The host declares which selected modules provide development dependencies. #}
    has_extra_dev_dependencies: {{ 'sphinx' in features }}

---
!include modules/sphinx/copier.yml
---
sphinx_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'sphinx' in features }}
    repository_name: {{ core.vars.repository_name | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    year: {{ core.vars.year }}
    has_readme: {{ 'README.md' in core.files | map(attribute='path') }}
    has_license: {{ 'LICENSE.md' in core.files | map(attribute='path') }}
    has_python_package: {{ ('src/' ~ python.vars.package_name ~ '/__init__.py') in python.files | map(attribute='path') }}

---
!include modules/gitlab/copier.yml
---
gitlab_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'gitlab' in features }}
    repository_host: {{ core.vars.repository_host | to_json }}
    repository_path: {{ core.vars.repository_path | to_json }}
    has_readme: {{ 'README.md' in core.files | map(attribute='path') }}
    copier_version: {{ copier.vars.version | to_json }}
    python_enabled: {{ python.vars.enabled }}
    python_tools: {{ python.vars.tools | to_json }}
    python_version: {{ python.vars.version | to_json }}
    has_python_distribution: {{ python.vars.has_distribution }}
    sphinx_enabled: {{ sphinx.vars.enabled }}

---
!include modules/codex/copier.yml
---
codex_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'codex' in features }}
    devcontainer_available: {{ 'devcontainer' in features }}

---
!include modules/devcontainer/copier.yml
---
devcontainer_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'devcontainer' in features }}
    {% if python is defined and python.vars.enabled %}
    image: {{ ('mcr.microsoft.com/devcontainers/python:3-' ~ python.vars.version ~ '-bookworm') | to_json }}
    {% endif %}

---
# Generic aggregation of module exports; contains no module-specific wiring.
!include modules/aggregation/copier.yml
