---
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template_new  # TODO: Switch back to template after refactoring is completed

copier_version:
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

features:
  type: yaml
  help: Which template features shall be used?
  multiselect: true
  choices:
    Codex:
      value:
        module: codex
        path: modules/codex
    DevContainer:
      value:
        module: devcontainer
        path: modules/devcontainer

---
!include modules/codex/copier.yml

---
!include modules/devcontainer/copier.yml

---
files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- set module_files = {
      'codex': codex_files,
      'devcontainer': devcontainer_files,
    } -%}
    {%- set result = namespace(files=[]) -%}
    {%- for feature in features -%}
      {%- for file in module_files[feature.module] -%}
        {%- set result.files = result.files + [{
          'path': file.path,
          'template': feature.path ~ '/' ~ file.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.files | to_json }}
