# General Configuration
_min_copier_version: &min_copier_version "9.17.2"
_subdirectory: template_new  # TODO: Switch back to template after refactoring is completed

copier_version:  # TODO: Maybe remove if *min_copier_version can directly be used as module input
  type: str
  help: Which Copier version does this template require?
  default: *min_copier_version
  when: false

# Select Modules
features:
  type: yaml
  help: Which template features shall be used?
  multiselect: true
  choices:
    Core:
      value:
        module: core
        path: modules/core
    Copier:
      value:
        module: copier
        path: modules/copier
    Python:
      value:
        module: python
        path: modules/python
    Sphinx:
      value:
        module: sphinx
        path: modules/sphinx
    GitLab:
      value:
        module: gitlab
        path: modules/gitlab
    Codex:
      value: &codex
        module: codex
        path: modules/codex
    DevContainer:
      value: &devcontainer
        module: devcontainer
        path: modules/devcontainer
  default:
    - *codex
    - *devcontainer

# Include Modules
---
!include modules/core/copier.yml
---
!include modules/copier/copier.yml
---
!include modules/python/copier.yml
---
!include modules/sphinx/copier.yml
---
!include modules/gitlab/copier.yml
---
!include modules/codex/copier.yml
---
!include modules/devcontainer/copier.yml
---

# Module Inputs
gitlab_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'gitlab' in features | map(attribute='module') }}
    repository_host: {{ core.vars.repository_host | to_json }}
    repository_path: {{ core.vars.repository_path | to_json }}
    include_readme: {{ core.vars.include_readme }}
    copier_version: {{ copier.vars.version | to_json }}
    python_enabled: {{ python.vars.enabled }}
    python_tools: {{ python.vars.tools | to_json }}
    python_version: {{ python.vars.version | to_json }}
    python_include_distribution: {{ python.vars.include_distribution }}
    sphinx_enabled: {{ sphinx.vars.enabled }}

sphinx_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'sphinx' in features | map(attribute='module') }}
    repository_name: {{ core.vars.repository_name | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    year: {{ core.vars.year }}
    include_readme: {{ core.vars.include_readme }}
    include_license: {{ core.vars.include_license }}
    python_include_package: {{ python.vars.include_package }}

python_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'python' in features | map(attribute='module') }}
    repository_name: {{ core.vars.repository_name | to_json }}
    include_readme: {{ core.vars.include_readme }}
    include_license: {{ core.vars.include_license }}
    license: {{ core.vars.license | to_json }}
    owner_name: {{ core.vars.owner_name | to_json }}
    owner_email: {{ core.vars.owner_email | to_json }}
    sphinx_enabled: {{ 'sphinx' in features | map(attribute='module') }}

copier_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'copier' in features | map(attribute='module') }}
    version: {{ copier_version | to_json }}

core_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'core' in features | map(attribute='module') }}

codex_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    enabled: {{ 'codex' in features | map(attribute='module') }}
    devcontainer: {{ 'devcontainer' in features | map(attribute='module') }}

devcontainer_inputs:
  type: yaml
  help: Which inputs should be used for the module?
  when: false
  default: |
    {%- set python_vars = python.vars if python is defined else {} -%}
    enabled: {{ 'devcontainer' in features | map(attribute='module') }}
    python_enabled: {{ python_vars.enabled | default(false) }}
    python_version: {{ python_vars.version | default('3.12') | to_json }}
    python_include_setup: {{ python_vars.include_setup | default(false) }}
    python_include_distribution: {{ python_vars.include_distribution | default(false) }}
    python_include_devgroup: {{ python_vars.include_devgroup | default(false) }}

# Output Aggregation
# Each selected module exposes its output through exports.jinja.
files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- set result = namespace(files=[]) -%}
    {%- for feature in features -%}
      {%- from feature.path ~ '/exports.jinja' import output with context -%}
      {%- for file in output.files -%}
        {%- set result.files = result.files + [{
          'path': file.path,
          'template': feature.path ~ '/' ~ file.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.files | to_json }}

contributions:
  type: yaml
  help: Which contributions shall be made to other files?
  when: false
  default: |
    {%- set result = namespace(contributions=[]) -%}
    {%- for feature in features -%}
      {%- from feature.path ~ '/exports.jinja' import output with context -%}
      {%- for contribution in output.contributions -%}
        {%- set result.contributions = result.contributions + [{
          'id': contribution.id,
          'template': feature.path ~ '/' ~ contribution.template,
        }] -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ result.contributions | to_json }}
