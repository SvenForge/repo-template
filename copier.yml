---
_min_copier_version: "9.17"
_subdirectory: template
_exclude:
  - _modules

features:
  type: str
  help: Which template features shall be used?
  multiselect: true
  choices:
    GitLab: gitlab
  default: []

modules:
  type: yaml
  help: Which template modules shall be used?
  default: "{{ ['core'] + features }}"
  when: false
---
!include template/_modules/core/copier.yml
