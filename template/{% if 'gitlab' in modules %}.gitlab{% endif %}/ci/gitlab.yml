# Gitlab Pipeline Definition

.gitlab:base:
  image: python:3.12-slim

gitlab:copier-update:
  extends: .gitlab:base
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      exists:
        - .copier-answers.yml
    - if: $CI_PIPELINE_SOURCE == "web"
      exists:
        - .copier-answers.yml
      when: manual
  before_script:
    - python -m pip install "copier==9.17.2"
  script:
    - copier update --pretend --defaults --skip-tasks
