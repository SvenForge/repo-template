# Gitlab Pipeline Definition

.gitlab:base:
  interruptible: true

{% if gitlab_include_copier_job %}
gitlab:copier-update:
  extends: .gitlab:base
  image: python:3.12-slim
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      exists:
        - .copier-answers.yml
    - if: $CI_PIPELINE_SOURCE == "web"
      exists:
        - .copier-answers.yml
      when: manual
  before_script:
    - python -m pip install "copier==9.17.2"
  script:
    - copier check-update
{% endif %}
{% if gitlab_include_demo_job %}
gitlab:demo:
  extends: .gitlab:base
  image:
    name: rancher/cowsay:latest
    entrypoint: [""]
  needs: []
  before_script:
    - apk add --no-cache fortune
  script:
    - fortune | cowsay
{% endif %}
