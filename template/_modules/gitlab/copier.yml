gitlab_include_issue_template:
  type: bool
  help: Create the default GitLab issue template?
  default: "{{ 'gitlab' in features }}"
  when: false

gitlab_include_merge_request_template:
  type: bool
  help: Create the default GitLab merge request template?
  default: "{{ 'gitlab' in features }}"
  when: false

gitlab_pipeline:
  type: str
  help: Which jobs shall be included in the GitLab pipeline?
  multiselect: true
  choices: |
    Check for Copier template updates: copier
    Run the demonstration job: demo
    {% if 'python' in features %}
    Run the Python test and quality jobs: python
    {% endif %}
    {% if 'sphinx' in features %}
    Build and deploy the Sphinx documentation: sphinx
    {% endif %}
  default: >-
    [copier, demo{% if 'python' in features %}, python{% endif %}{% if 'sphinx' in features %}, sphinx{% endif %}]
  when: "{{ 'gitlab' in features }}"

gitlab_include_pipeline_copier:
  type: bool
  help: Create the Copier pipeline module?
  default: "{{ 'gitlab' in features and 'copier' in gitlab_pipeline }}"
  when: false

gitlab_include_pipeline_demo:
  type: bool
  help: Create the demonstration pipeline module?
  default: "{{ 'gitlab' in features and 'demo' in gitlab_pipeline }}"
  when: false

gitlab_include_pipeline_python:
  type: bool
  help: Create the Python pipeline module?
  default: "{{ 'gitlab' in features and 'python' in features and 'python' in gitlab_pipeline }}"
  when: false

gitlab_include_pipeline_sphinx:
  type: bool
  help: Create the Sphinx pipeline module?
  default: "{{ 'gitlab' in features and 'sphinx' in features and 'sphinx' in gitlab_pipeline }}"
  when: false

gitlab_pages_url:
  type: str
  help: At which URL is the Sphinx documentation published by GitLab Pages? (optional)
  default: >-
    {%- set path = core_repository_path.split('/') -%}
    {{- 'https://' ~ path[0] ~ '.gitlab.io/' ~ (
      '' if path | length == 2 and path[1] == path[0] ~ '.gitlab.io'
      else path[1:] | join('/') ~ '/'
    ) if core_repository_host == 'gitlab.com' and core_repository_path else '' -}}
  when: "{{ gitlab_include_pipeline_sphinx and core_include_readme }}"

gitlab_include_pipeline:
  type: bool
  help: Create the GitLab CI/CD pipeline?
  default: "{{ 'gitlab' in features and gitlab_pipeline | length > 0 }}"
  when: false
