core_repository_name:
  type: str
  help: What is the repository name?
  default: My Repository

core_repository_url:
  type: str
  help: Where is the repository hosted?
  default: https://gitlab.com/repository-owner/my-repository

core_owner_name:
  type: str
  help: Who owns the repository?
  default: Repository Owner

core_owner_email:
  type: str
  help: What is the repository owner's email address?
  default: ""

core_owner_user:
  type: str
  help: What is the repository owner's username?
  default: ""
