core_repository_name:
  type: str
  help: What is the name of the repository?
  default: My Repository

core_repository_slug:
  type: str
  help: What slug should be used for the repository?
  default: "{{ core_repository_name | lower | replace('_', '-') | replace(' ', '-') }}"

core_repository_url:
  type: str
  help: At which URL is the repository hosted? (optional)
  default: ""

core_owner_name:
  type: str
  help: Who is the repository owner or maintainer?
  default: Repository Owner

core_owner_email:
  type: str
  help: What is the owner's email address? (optional)
  default: ""

core_owner_user:
  type: str
  help: What is the owner's hosting username? (optional)
  default: ""

core_year:
  type: int
  help: What is the current year?
  default: "{{ '%Y' | strftime }}"
  when: false

core_include_license:
  type: bool
  help: Create LICENSE.md?
  default: true

core_license:
  type: str
  help: Which license should be used?
  choices:
    All rights reserved: all-rights-reserved
    MIT: mit
  default: all-rights-reserved
  when: "{{ core_include_license }}"

core_include_gitignore:
  type: bool
  help: Create .gitignore?
  default: true
