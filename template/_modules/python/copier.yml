python_package_name:
  type: str
  help: What is the Python import package name? (optional)
  default: ""
  validator: >-
    {% if python_package_name and not (python_package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    Use a valid lowercase Python identifier with underscores as separators.
    {% endif %}
  when: "{{ 'python' in features }}"

python_distribution_name:
  type: str
  help: What is the Python distribution name? (optional)
  default: >-
    {{ python_package_name | replace('_', '-') | regex_replace('-+', '-') | regex_replace('(^-+|-+$)', '') }}
  validator: >-
    {% if python_distribution_name and not (python_distribution_name | regex_search('^[a-z0-9]+(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters and numbers separated by single hyphens.
    {% endif %}
  when: "{{ 'python' in features and python_package_name }}"

python_tools:
  type: str
  help: Which Python tools shall be set up?
  multiselect: true
  choices:
    pytest: pytest
    Ruff: ruff
    mypy: mypy
  default:
    - pytest
    - ruff
    - mypy
  when: "{{ 'python' in features }}"

python_version:
  type: str
  help: What is the minimum supported Python version?
  default: "3.12"
  validator: >-
    {% if not (python_version | regex_search('^[0-9]+[.][0-9]+$')) %}
    Use a numeric Python major and minor version, such as 3.12.
    {% endif %}
  when: "{{ 'python' in features }}"

python_testpackage_name:
  type: str
  help: What is the Python test package name?
  default: "test_{{ python_package_name if python_package_name else 'project' }}"
  when: false

python_include_pyproject:
  type: bool
  help: Create pyproject.toml?
  default: "{{ 'python' in features }}"
  when: false

python_include_package:
  type: bool
  help: Create the Python package?
  default: "{{ 'python' in features and python_package_name }}"
  when: false

python_include_distribution:
  type: bool
  help: Configure the Python distribution?
  default: "{{ 'python' in features and python_package_name and python_distribution_name }}"
  when: false

python_include_testpackage:
  type: bool
  help: Create the Python test package?
  default: "{{ 'python' in features and 'pytest' in python_tools }}"
  when: false

python_include_importtest:
  type: bool
  help: Create the Python package import test?
  default: "{{ python_include_package and python_include_testpackage }}"
  when: false

python_include_devgroup:
  type: bool
  help: Create the Python development dependency group?
  default: "{{ 'python' in features and (python_tools | length > 0 or 'sphinx' in features) }}"
  when: false

python_include_setup:
  type: bool
  help: Install the Python project or development dependencies?
  default: "{{ python_include_distribution or python_include_devgroup }}"
  when: false
