[dependency-groups]
test = [
    "copier==9.17.2",
    "PyYAML",
    "pytest",
    "pytest-cov",
]
lint = [
"mypy",
    "mypy-gitlab-code-quality",
"ruff",
]
doc = [
    "furo",
    "myst-parser",
    "sphinx>=8.2",
]
dev = [
{ include-group = "test" },
{ include-group = "lint" },
{ include-group = "doc" },
]




[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--junitxml=pytest.xml",
]
testpaths = ["src/test_*"]


[tool.coverage.run]
branch = true
omit = ["test_*"]

[tool.coverage.report]
show_missing = true


[tool.ruff]
src = ["src"]
exclude = [
    ".git",
    "__pycache__",
    "*/.ipynb_checkpoints/*.py",
]
line-length = 200
indent-width = 4

[tool.ruff.lint]
extend-select = [
    "D",    # pydocstyle
    "N",    # pep8-naming
    "Q",    # flake8-quotes
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "FIX",  # flake8-fixme
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "D212",  # multi-line docstring summary should start at the first line
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conf.py" = ["D100"]
"src/test_*" = ["S101", "D101", "D102", "D103", "B011", "D107"]
"notebook/*.ipynb" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"


[tool.mypy]
files = ["src"]
strict = true

