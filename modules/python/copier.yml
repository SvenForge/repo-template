# Module Defaults
python_defaults:
  type: yaml
  when: false
  default:
    enabled: true
    package_name: ''
    distribution_name: ''
    tools:
      - pytest
      - ruff
      - mypy
    version: '3.12'
    testpackage_name: test_project
    repository_name: My Repository
    has_readme: false
    has_license: false
    license: NOASSERTION
    owner_name: ''
    owner_email: ''
    has_extra_dev_dependencies: false

# Module Inputs
# To be overwritten by template, otherwise defaults will be used
python_inputs:
  type: yaml
  help: Which inputs shall be used for the module?
  when: false
  default: {}

# Module Questions
python_package_name:
  type: str
  help: What is the Python import package name? (optional)
  default: "{{ python_inputs.package_name | default(python_defaults.package_name) }}"
  validator: >-
    {% if python_package_name and not (python_package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    Use a valid lowercase Python identifier with underscores as separators.
    {% endif %}
  when: "{{ (python_inputs.enabled | default(python_defaults.enabled)) }}"

python_distribution_name:
  type: str
  help: What is the Python distribution name? (optional)
  default: >-
    {{ python_inputs.distribution_name if python_inputs.distribution_name is defined else
      (python_package_name | replace('_', '-') | regex_replace('-+', '-') | regex_replace('(^-+|-+$)', '')
        if python_package_name else python_defaults.distribution_name) }}
  validator: >-
    {% if python_distribution_name and not (python_distribution_name | regex_search('^[a-z0-9]+(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters and numbers separated by single hyphens.
    {% endif %}
  when: "{{ (python_inputs.enabled | default(python_defaults.enabled)) and python_package_name }}"

python_tools:
  type: str
  help: Which Python tools shall be set up?
  multiselect: true
  choices:
    pytest: pytest
    Ruff: ruff
    mypy: mypy
  default: "{{ python_inputs.tools | default(python_defaults.tools) | to_json }}"
  when: "{{ (python_inputs.enabled | default(python_defaults.enabled)) }}"

python_version:
  type: str
  help: What is the minimum supported Python version?
  default: "{{ python_inputs.version | default(python_defaults.version) }}"
  validator: >-
    {% if not (python_version | regex_search('^[0-9]+[.][0-9]+$')) %}
    Use a numeric Python major and minor version, such as 3.12.
    {% endif %}
  when: "{{ (python_inputs.enabled | default(python_defaults.enabled)) }}"

python_testpackage_name:
  type: str
  help: What is the Python test package name?
  default: >-
    {%- set repository = python_inputs.repository_name | default(python_defaults.repository_name)
      | lower | regex_replace('[^a-z0-9_]+', '_') | regex_replace('_+', '_') | regex_replace('(^_+|_+$)', '') -%}
    {{ python_inputs.testpackage_name if python_inputs.testpackage_name is defined else
      ('test_' ~ python_package_name if python_package_name else
        ('test_' ~ repository if repository else python_defaults.testpackage_name)) }}
  validator: >-
    {% if (python_inputs.enabled | default(python_defaults.enabled)) and 'pytest' in python_tools %}
    {% if not (python_testpackage_name | regex_search('^[a-z_][a-z0-9_]*$')) or python_testpackage_name in
      ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except',
       'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass',
       'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    Use a nonempty lowercase Python identifier that is not a keyword.
    {% elif python_testpackage_name == python_package_name %}
    Use a test package name different from the production package name.
    {% endif %}
    {% endif %}
  when: "{{ (python_inputs.enabled | default(python_defaults.enabled)) and 'pytest' in python_tools }}"

# Module Outputs
python:
  type: yaml
  when: false
  default: |
    {%- set vars = dict(python_defaults, **python_inputs) -%}
    {%- set vars = dict(vars,
      package_name=python_package_name,
      distribution_name=python_distribution_name,
      tools=python_tools,
      version=python_version,
      testpackage_name=python_testpackage_name,
    ) -%}
    {%- set vars = dict(vars,
      has_dev_dependencies=python_inputs.has_dev_dependencies if python_inputs.has_dev_dependencies is defined else vars.enabled and (vars.tools | length > 0 or vars.has_extra_dev_dependencies),
      has_distribution=python_inputs.has_distribution if python_inputs.has_distribution is defined else vars.enabled and vars.package_name | length > 0 and vars.distribution_name | length > 0,
    ) -%}
    vars: {{ vars | to_json }}
    files:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled %}
      - path: pyproject.toml
        template: files/pyproject.toml.jinja
      {%- if vars.package_name %}
      - path: src/{{ vars.package_name }}/__init__.py
        template: files/package/__init__.py.jinja
      {%- endif %}
      {%- if 'pytest' in vars.tools %}
      - path: src/{{ vars.testpackage_name }}/__init__.py
        template: files/testpackage/__init__.py.jinja
      - path: src/{{ vars.testpackage_name }}/test_self.py
        template: files/testpackage/test_self.py.jinja
      {%- if vars.package_name %}
      - path: src/{{ vars.testpackage_name }}/test_import.py
        template: files/testpackage/test_import.py.jinja
      {%- endif %}
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
    contributions:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled %}
      - target: core.gitignore
        template: fragments/gitignore.jinja
      {%- if python_inputs.install | default(vars.has_distribution or vars.has_dev_dependencies) %}
      - target: codex.setup
        template: fragments/setup.sh.jinja
      - target: codex.maintenance
        template: fragments/maintenance.sh.jinja
      - target: devcontainer.postCreateCommand
        template: fragments/devcontainer.postCreateCommand.json.jinja
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
