# Module Inputs
python_inputs:
  type: yaml
  help: Which inputs shall be used for the module?
  when: false
  default: |
    enabled: true

# Module Questions
python_package_name:
  type: str
  help: What is the Python import package name? (optional)
  default: "{{ python_inputs.package_name | default('') }}"
  validator: >-
    {% if python_package_name and not (python_package_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    Use a valid lowercase Python identifier with underscores as separators.
    {% endif %}
  when: "{{ python_inputs.enabled }}"

python_distribution_name:
  type: str
  help: What is the Python distribution name? (optional)
  default: >-
    {{ python_inputs.distribution_name | default(python_package_name | replace('_', '-') | regex_replace('-+', '-') | regex_replace('(^-+|-+$)', '')) }}
  validator: >-
    {% if python_distribution_name and not (python_distribution_name | regex_search('^[a-z0-9]+(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters and numbers separated by single hyphens.
    {% endif %}
  when: "{{ python_inputs.enabled and python_package_name }}"

python_tools:
  type: str
  help: Which Python tools shall be set up?
  multiselect: true
  choices:
    pytest: pytest
    Ruff: ruff
    mypy: mypy
  default: "{{ python_inputs.tools | default(['pytest', 'ruff', 'mypy']) | to_json }}"
  when: "{{ python_inputs.enabled }}"

python_version:
  type: str
  help: What is the minimum supported Python version?
  default: "{{ python_inputs.version | default('3.12') }}"
  validator: >-
    {% if not (python_version | regex_search('^[0-9]+[.][0-9]+$')) %}
    Use a numeric Python major and minor version, such as 3.12.
    {% endif %}
  when: "{{ python_inputs.enabled }}"

python_testpackage_name:
  type: str
  help: What is the Python test package name?
  default: "{{ python_inputs.testpackage_name | default('test_' ~ (python_package_name or 'project')) }}"
  when: false

# Module Outputs
python:
  type: yaml
  when: false
  default: |
    {%- set include_package = python_inputs.enabled and python_package_name | length > 0 -%}
    {%- set include_distribution = include_package and python_distribution_name | length > 0 -%}
    {%- set include_devgroup = python_inputs.enabled and (python_tools | length > 0 or python_inputs.sphinx_enabled | default(false)) -%}
    vars:
      enabled: {{ python_inputs.enabled }}
      package_name: {{ python_package_name | to_json }}
      distribution_name: {{ python_distribution_name | to_json }}
      tools: {{ python_tools | to_json }}
      version: {{ python_version | to_json }}
      testpackage_name: {{ python_testpackage_name | to_json }}
      repository_name: {{ python_inputs.repository_name | default('My Repository') | to_json }}
      include_readme: {{ python_inputs.include_readme | default(false) }}
      include_license: {{ python_inputs.include_license | default(false) }}
      license: {{ python_inputs.license | default('NOASSERTION') | to_json }}
      owner_name: {{ python_inputs.owner_name | default('') | to_json }}
      owner_email: {{ python_inputs.owner_email | default('') | to_json }}
      sphinx_enabled: {{ python_inputs.sphinx_enabled | default(false) }}
      include_package: {{ include_package }}
      include_distribution: {{ include_distribution }}
      include_devgroup: {{ include_devgroup }}
      include_setup: {{ include_distribution or include_devgroup }}
    files:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if python_inputs.enabled %}
      - path: pyproject.toml
        template: files/pyproject.toml.jinja
      {%- if python_package_name %}
      - path: src/{{ python_package_name }}/__init__.py
        template: files/package/__init__.py.jinja
      {%- endif %}
      {%- if 'pytest' in python_tools %}
      - path: src/{{ python_testpackage_name }}/__init__.py
        template: files/testpackage/__init__.py.jinja
      - path: src/{{ python_testpackage_name }}/test_self.py
        template: files/testpackage/test_self.py.jinja
      {%- if python_package_name %}
      - path: src/{{ python_testpackage_name }}/test_import.py
        template: files/testpackage/test_import.py.jinja
      {%- endif %}
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
    contributions:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if python_inputs.enabled %}
      - id: core.gitignore
        template: fragments/gitignore.jinja
      {%- if include_distribution or include_devgroup %}
      - id: codex.setup
        template: fragments/setup.sh.jinja
      - id: codex.maintenance
        template: fragments/maintenance.sh.jinja
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
