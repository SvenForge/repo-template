# Module Defaults
codex_defaults:
  type: yaml
  when: false
  default:
    enabled: true
    cloud: true
    devcontainer: false

# Module Inputs
# To be overwritten by template, otherwise defaults will be used
codex_inputs:
  type: yaml
  help: Which inputs shall be used for the module?
  when: false
  default: {}

# Module Questions
codex_cloud:
  type: bool
  help: Set up Codex Cloud integration?
  default: "{{ codex_inputs.cloud | default((codex_inputs.enabled | default(codex_defaults.enabled)) and codex_defaults.cloud) }}"
  when: "{{ codex_inputs.enabled | default(codex_defaults.enabled) }}"

codex_devcontainer:
  type: bool
  help: Add Codex integration to the Dev Container?
  default: "{{ codex_inputs.devcontainer | default(codex_defaults.devcontainer) }}"
  when: "{{ (codex_inputs.enabled | default(codex_defaults.enabled)) and (codex_inputs.devcontainer | default(codex_defaults.devcontainer)) }}"

# Module Outputs
codex:
  type: yaml
  when: false
  default: |
    {%- set vars = dict(codex_defaults, **codex_inputs) -%}
    {%- set vars = dict(vars,
      cloud=codex_cloud,
      devcontainer=codex_devcontainer,
    ) -%}
    vars: {{ vars | to_json }}
    files:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled %}
      - path: AGENTS.md
        template: files/AGENTS.md.jinja
      {%- if vars.cloud %}
      - path: .codex/setup.sh
        template: files/setup.sh.jinja
      - path: .codex/maintenance.sh
        template: files/maintenance.sh.jinja
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
    contributions:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled and vars.devcontainer %}
      - id: devcontainer.features
        template: fragments/devcontainer.features.json.jinja
      - id: devcontainer.mounts
        template: fragments/devcontainer.mounts.json.jinja
      - id: devcontainer.extensions
        template: fragments/devcontainer.extensions.json.jinja
      - id: devcontainer.postCreateCommand
        template: fragments/devcontainer.postCreateCommand.json.jinja
      {%- endif %}
      {%- endfilter %}
