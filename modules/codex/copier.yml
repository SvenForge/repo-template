codex_cloud:
  type: bool
  help: Set up Codex Cloud integration?
  default: "{{ 'codex' in features | map(attribute='module') }}"
  when: "{{ 'codex' in features | map(attribute='module') }}"

codex_devcontainer:
  type: bool
  help: Add Codex integration to the Dev Container?
  default: "{{ 'codex' in features | map(attribute='module') and 'devcontainer' in features | map(attribute='module') }}"
  when: "{{ 'codex' in features | map(attribute='module') and 'devcontainer' in features | map(attribute='module') }}"

codex_files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- filter trim | default('[]', true) %}
    {%- if 'codex' in features | map(attribute='module') %}
    - path: AGENTS.md
      template: files/AGENTS.md.jinja
    {%- if codex_cloud %}
    - path: .codex/setup.sh
      template: files/setup.sh.jinja
    - path: .codex/maintenance.sh
      template: files/maintenance.sh.jinja
    {%- endif %}
    {%- endif %}
    {%- endfilter %}

codex_contributions:
  type: yaml
  help: Which contributions shall be made to other files?
  when: false
  default: |
    {%- filter trim | default('[]', true) %}
    {%- if codex_devcontainer %}
    - id: devcontainer.features
      template: fragments/devcontainer.features.json.jinja
    - id: devcontainer.mounts
      template: fragments/devcontainer.mounts.json.jinja
    - id: devcontainer.extensions
      template: fragments/devcontainer.extensions.json.jinja
    - id: devcontainer.postCreateCommand
      template: fragments/devcontainer.postCreateCommand.json.jinja
    {%- endif %}
    {%- endfilter %}
