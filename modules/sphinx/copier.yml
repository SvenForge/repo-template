# Module Inputs
sphinx_inputs:
  type: yaml
  help: Which inputs shall be used for the module?
  when: false
  default: |
    enabled: true

# Module Questions
sphinx_needs:
  type: bool
  help: Include Sphinx-Needs support?
  default: "{{ sphinx_inputs.needs | default(false) }}"
  when: "{{ sphinx_inputs.enabled }}"

sphinx_needs_pages:
  type: str
  help: Which Sphinx-Needs starter pages shall be created?
  multiselect: true
  choices:
    Requirements: requirements
    Architecture: architecture
    Implementation: implementation
    Verification: verification
  default: "{{ sphinx_inputs.needs_pages | default(['requirements', 'architecture', 'implementation', 'verification']) | to_json }}"
  when: "{{ sphinx_inputs.enabled and sphinx_needs }}"

# Module Outputs
sphinx:
  type: yaml
  when: false
  default: |
    vars:
      enabled: {{ sphinx_inputs.enabled }}
      needs: {{ sphinx_needs }}
      needs_pages: {{ sphinx_needs_pages | to_json }}
      repository_name: {{ sphinx_inputs.repository_name | default('My Repository') | to_json }}
      owner_name: {{ sphinx_inputs.owner_name | default('') | to_json }}
      year: {{ sphinx_inputs.year | default('%Y' | strftime) }}
      include_readme: {{ sphinx_inputs.include_readme | default(false) }}
      include_license: {{ sphinx_inputs.include_license | default(false) }}
      python_include_package: {{ sphinx_inputs.python_include_package | default(false) }}
    files:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if sphinx_inputs.enabled %}
      - path: doc/sphinx/conf.py
        template: files/conf.py.jinja
      - path: doc/sphinx/index.md
        template: files/index.md.jinja
      - path: doc/notes.md
        template: files/notes.md.jinja
      - path: doc/sphinx/Makefile
        template: files/Makefile.jinja
      - path: doc/sphinx/make.bat
        template: files/make.bat.jinja
      {%- if sphinx_inputs.python_include_package | default(false) %}
      - path: doc/api.md
        template: files/api.md.jinja
      {%- endif %}
      {%- if sphinx_needs %}
      {%- for page in sphinx_needs_pages %}
      - path: doc/{{ page }}.md
        template: files/{{ page }}.md.jinja
      {%- endfor %}
      {%- endif %}
      {%- endif %}
      {%- endfilter %}
    contributions:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if sphinx_inputs.enabled %}
      - id: core.gitignore
        template: fragments/gitignore.jinja
      - id: python.dependency_groups
        template: fragments/dependency_groups.toml.jinja
      - id: python.dev_dependencies
        template: fragments/dev_dependencies.toml.jinja
      {%- endif %}
      {%- endfilter %}
