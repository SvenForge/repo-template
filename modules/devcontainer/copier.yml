# Module Questions

# Module Outputs
devcontainer_files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- filter trim | default('[]', true) %}
    {%- if 'devcontainer' in features | map(attribute='module') %}
    - path: .devcontainer/devcontainer.json
      template: files/devcontainer.json.jinja
    {%- endif %}
    {%- endfilter %}

devcontainer_contributions:
  type: yaml
  help: Which contributions shall be made to other files?
  when: false
  default: |
    {%- filter trim | default('[]', true) %}
    {%- if 'devcontainer' in features | map(attribute='module') %}
    - id: devcontainer.extensions
      template: fragments/devcontainer.extensions.json.jinja
    {%- endif %}
    {%- endfilter %}
