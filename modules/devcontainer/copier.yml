devcontainer_include_config:
  type: bool
  help: Create the Dev Container configuration?
  default: "{{ 'devcontainer' in features | map(attribute='module') }}"
  when: false

devcontainer_files:
  type: yaml
  help: Which files shall be generated?
  when: false
  default: |
    {%- filter trim | default('[]', true) %}
    {%- if devcontainer_include_config %}
    - path: .devcontainer/devcontainer.json
      template: files/devcontainer.json.jinja
    {%- endif %}
    {%- endfilter %}
