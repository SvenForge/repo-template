# Module Defaults
devcontainer_defaults:
  type: yaml
  when: false
  default:
    enabled: true
    python_enabled: false
    python_version: '3.12'
    python_include_setup: false
    python_include_distribution: false
    python_include_devgroup: false

# Module Inputs
# To be overwritten by template, otherwise defaults will be used
devcontainer_inputs:
  type: yaml
  help: Which inputs shall be used for the module?
  when: false
  default: {}

# Module Questions

# Module Outputs
devcontainer:
  type: yaml
  when: false
  default: |
    {%- set vars = dict(devcontainer_defaults, **devcontainer_inputs) -%}
    vars: {{ vars | to_json }}
    files:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled %}
      - path: .devcontainer/devcontainer.json
        template: files/devcontainer.json.jinja
      {%- endif %}
      {%- endfilter %}
    contributions:
      {% filter trim | default('[]', true) | indent(2, true) %}
      {%- if vars.enabled %}
      - target: devcontainer.extensions
        template: fragments/devcontainer.extensions.json.jinja
      {%- endif %}
      {%- endfilter %}
